<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- External CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>


    <!-- Header -->
    <header class="bg-secondary-subtle">
        <!-- Navbar -->
        <nav class="text-center bg-warning-subtle py-3">
            <h1>Navbar</h1>
        </nav>

        <!-- Banner section -->
        <section id="banner"
            class="vh-100 bg-danger-subtle text-center d-flex align-items-center justify-content-center">
            <h1>Banner Section</h1>
        </section>
    </header>


    <!-- Main -->
    <main>

        <!-- About section -->
        <section id="about"
            class="vh-100  py-2 bg-warning-subtle text-center d-flex align-items-center justify-content-center">
            <h1>About-section</h1>
        </section>


        <!-- Project section -->
        <section id="project"
            class="vh-100  py-2 bg-danger-subtle text-center d-flex align-items-center justify-content-center">
            <h1>Project-section</h1>
        </section>

        <!-- Testimonials section -->
        <section id="testimonials"
            class="vh-100  py-2 bg-warning-subtle text-center d-flex align-items-center justify-content-center">
            <h1>Testimonials-section</h1>
        </section>

        <!-- Project section -->
        <section id="form"
            class="vh-100  py-2 bg-danger-subtle text-center d-flex align-items-center justify-content-center">
            <h1>Contact-section</h1>
        </section>

    </main>


    <!-- Footer -->
    <footer class="py-5 bg-secondary-subtle text-center">
        <h1>Footer</h1>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
